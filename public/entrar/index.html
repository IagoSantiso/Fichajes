<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1f5fbf">
<title>Entrar · Registro de jornada</title>
<link rel="icon" href="/iconos/icono-192.png">
<link rel="stylesheet" href="/css/estilo.css">
</head>
<body>
<section class="centrado" style="padding-top:3rem">
  <h1>Entrar</h1>
  <p class="ayuda">
    Para empresas y gestorías. Le enviamos un enlace de acceso al correo:
    no hay contraseña que recordar.
  </p>
  <div id="aviso" class="aviso" hidden></div>
  <form id="form">
    <div class="campo">
      <label for="email">Correo electrónico</label>
      <input type="email" id="email" autocomplete="email" required>
    </div>
    <button type="submit" style="width:100%">Enviarme el enlace</button>
  </form>
  <p class="ayuda" style="margin-top:1.5rem">
    ¿Es usted trabajador? <a href="/">Fiche con su código y su PIN</a>.
  </p>
</section>

<script type="module">
import { api, avisar } from '/js/api.js';

const form = document.getElementById('form');
form.addEventListener('submit', async (evento) => {
  evento.preventDefault();
  const boton = form.querySelector('button');
  boton.disabled = true;
  try {
    const datos = await api('/api/auth/enlace', {
      metodo: 'POST',
      silencioso: true,
      cuerpo: { email: document.getElementById('email').value.trim() },
    });
    avisar(document.getElementById('aviso'), datos.mensaje + '. Revise su bandeja de entrada.', 'exito');
    form.reset();
  } catch (error) {
    avisar(document.getElementById('aviso'), error.message, 'error');
  } finally {
    boton.disabled = false;
  }
});
</script>
</body>
</html>
