<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1f5fbf">
<title>Entrar · Registro de jornada</title>
<link rel="icon" href="/iconos/icono-192.png">
<link rel="stylesheet" href="/css/estilo.css">
</head>
<body>
<section class="centrado" style="padding-top:3rem">
  <h1>Entrar</h1>
  <p class="ayuda">
    Para empresas y gestorías. Le enviamos un enlace de acceso al correo:
    no hay contraseña que recordar.
  </p>
  <div id="aviso-demo" class="aviso pendiente" hidden></div>
  <div id="aviso" class="aviso" hidden></div>
  <div id="enlace-demo" hidden style="margin-bottom:1rem"></div>
  <form id="form">
    <div class="campo">
      <label for="email">Correo electrónico</label>
      <input type="email" id="email" autocomplete="email" required>
    </div>
    <button type="submit" style="width:100%">Enviarme el enlace</button>
  </form>
  <p class="ayuda" style="margin-top:1.5rem">
    ¿Es usted trabajador? <a href="/">Fiche con su código y su PIN</a>.
  </p>
</section>

<script type="module">
import { api, avisar, escapar } from '/js/api.js';

// Si el modo demostración está activo, se avisa y no hace falta correo real:
// el propio servidor lo dirá al pedir el enlace.
api('/api/auth/modo', { silencioso: true }).then((datos) => {
  if (!datos.demo) return;
  avisar(document.getElementById('aviso-demo'),
    'Modo demostración: no se envía ningún correo. Al pedir el enlace, esta '
    + 'misma pantalla lo mostrará con un botón para entrar.', 'pendiente');
}).catch(() => {});

const form = document.getElementById('form');
form.addEventListener('submit', async (evento) => {
  evento.preventDefault();
  const boton = form.querySelector('button');
  boton.disabled = true;
  const cajaEnlace = document.getElementById('enlace-demo');
  cajaEnlace.hidden = true;
  try {
    const datos = await api('/api/auth/enlace', {
      metodo: 'POST',
      silencioso: true,
      cuerpo: { email: document.getElementById('email').value.trim() },
    });

    if (datos.demo && datos.enlace) {
      cajaEnlace.innerHTML = `
        <div class="aviso exito" style="display:block">
          <p style="margin:0 0 .6rem">Enlace generado. Caduca en ${escapar(datos.minutos)} minutos y sólo sirve una vez.</p>
          <a href="${escapar(datos.enlace)}">
            <button type="button" style="width:100%">Entrar ahora</button>
          </a>
        </div>`;
      cajaEnlace.hidden = false;
      document.getElementById('aviso').hidden = true;
    } else {
      avisar(document.getElementById('aviso'), datos.mensaje + '. Revise su bandeja de entrada.', 'exito');
    }
    form.reset();
  } catch (error) {
    avisar(document.getElementById('aviso'), error.message, 'error');
  } finally {
    boton.disabled = false;
  }
});
</script>
</body>
</html>
