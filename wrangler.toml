name = "fichajes"
main = "src/index.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# La PWA se sirve como assets estáticos desde el propio Worker.
#
# not_found_handling se deja en "none" a propósito: esto no es una aplicación
# de página única, son cuatro páginas reales (/, /entrar/, /empresa/,
# /gestoria/). Con "single-page-application", cualquier ruta desconocida
# —incluida una de API que el Worker no reconozca— devolvía la pantalla de
# fichaje en lugar de un error, que es la peor forma de enterarse de que algo
# está mal desplegado.
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "none"

[[d1_databases]]
binding = "DB"
database_name = "fichajes"
database_id = "00000000-0000-0000-0000-000000000000"  # sustituir por el real: wrangler d1 create fichajes
migrations_dir = "migraciones"

# El motor de incidencias. Ver src/incidencias/motor.js
#  - cada 15 min: incidencias de expectativa del día en curso
#  - 21:50 UTC (23:50 en Europe/Madrid, horario de verano): cierre diario estructural
#  - 22:50 UTC cubre el horario de invierno; el motor descarta la ejecución
#    que no corresponda a las 23:50 locales de cada empresa.
[triggers]
crons = ["*/15 * * * *", "50 21 * * *", "50 22 * * *"]

[vars]
ENTORNO = "desarrollo"
# Remitente de los avisos de incidencias. El correo no interviene en el acceso.
CORREO_REMITENTE = "fichajes@example.com"
CORREO_NOMBRE_REMITENTE = "Registro de jornada"
# Proveedor de correo: "resend" | "consola" (desarrollo: vuelca a los logs)
CORREO_PROVEEDOR = "consola"

# Secretos (wrangler secret put ...):
#   SECRETO_SESION    -> clave HMAC para firmar cookies de sesión
#   RESEND_API_KEY    -> sólo si CORREO_PROVEEDOR = "resend"
